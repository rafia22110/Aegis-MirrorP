name: Aegis MirrorP CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build (Vercel Edge Functions)
        # Production is server-rendered by src/api/page.ts via Vercel
        # Edge Functions (see vercel.json). There is no Vite/webpack
        # bundle step — Vercel itself bundles each Edge Function entry
        # declared in vercel.json's rewrites array.
        # We only verify the entrypoints exist on disk; the deploy job
        # below is what actually runs `vercel build`.
        run: |
          test -f src/api/page.ts         || (echo "missing src/api/page.ts"; exit 1)
          test -f vercel.json             || (echo "missing vercel.json"; exit 1)
          grep -q "/src/api/page.ts" vercel.json || (echo "vercel.json must rewrite / to /src/api/page.ts"; exit 1)
          echo "OK — Edge Function entrypoint + vercel.json rewrites present."

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          AEGIS_ENGINE_URL: ${{ secrets.AEGIS_ENGINE_URL }}
        run: |
          npx --yes vercel@latest link --token $VERCEL_TOKEN --yes
          npx --yes vercel@latest deploy --token $VERCEL_TOKEN --prod --yes
